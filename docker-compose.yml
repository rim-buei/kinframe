services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    command: ["app"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/app.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      THEMES_DIR: /themes
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      STORAGE_PATH: ${STORAGE_PATH:-/data/objects}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      GLACIER_STORAGE_CLASS: ${GLACIER_STORAGE_CLASS:-GLACIER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      DEV_FAKE_OIDC: ${DEV_FAKE_OIDC:-0}
    volumes:
      - data:/data
      - ./themes:/themes:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_PATH: /data/app.db
      THEMES_DIR: /themes
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      STORAGE_PATH: ${STORAGE_PATH:-/data/objects}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      GLACIER_STORAGE_CLASS: ${GLACIER_STORAGE_CLASS:-GLACIER}
    volumes:
      - data:/data
      - ./themes:/themes:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
